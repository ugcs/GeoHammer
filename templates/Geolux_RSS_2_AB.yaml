  # Template display name
  name: "Geolux-RSS-2-AB"
  # Type of template for parsing data. Options are CSV and ColumnsFixedWidth
  file-type: CSV
  # Applies to the first 10 non-empty lines of the file to detect template
  match-regex: >-
    ^.*Date,Time,.*Latitude,Longitude,Heading,.*Altitude AGL,RSS:Direction,RSS:Velocity raw,RSS:Velocity filtered,RSS:Signal,RSS:Q1,RSS:Q2,RSS:Tilt,RSS:Trace
  file-format:
  # Applies to CSV type. 'true' if file has headers, otherwise false
    has-header: true
    # The symbol which used to make a comment
    comment-prefix: '#'
    # The symbol used to separate the integer part from the fractional part of a number written in decimal form. Options are ',' and '.'
    decimal-separator: '.'
    # Applies to CSV type. The symbol to separate values from line in CSV file;
    separator: ','
  # Applied on a quality check to all data values
  # RSS:Q1: this is an indicator related to the instrument vibrations. 
  #  0 – Excellent measurement quality
  #  1 – Good measurement quality
  #  2 – Low measurement quality
  #  3 – Unacceptable measurement quality
  # RSS:Q2: this is an indicator related to the radar signals. 
  #  0 – Excellent measurement quality
  #  1 – Good measurement quality
  #  2 – Low measurement quality
  #  3 – Unacceptable measurement quality
  data-validation: '{RSS:Q1} < 2 && {RSS:Q2} < 2'
  # Mapping data from source file to data. Required fields are latitude, longitude, time or timestamp, date or date-time
  data-mapping:
    latitude:
      header: Latitude
    longitude:
      header: Longitude
    time:
      header: Time
      format: 'H:mm:ss.fff'
    date:
      header: Date
      format: 'yyyy/MM/dd'
    data-values:
      - header: "Heading"
        semantic: "Heading"
        units: "deg"
        description: "Heading of the carrier in degrees clockwise from north."
        read-only: true
      - header: "Altitude AGL"
        semantic: "Altitude AGL"
        units: "m"
        description: "Height above ground level, measured by the onboard altimeter."
        read-only: true
      - header: "RSS:Direction"
        description: "Direction of the measured flow reported by the radar sensor: towards or away from the sensor."
        read-only: true
      - header: "RSS:Velocity raw"
        semantic: "RSS:Velocity raw"
        units: "m/s"
        description: "Surface flow velocity measured by the radar sensor, before the internal filtering of the sensor."
        read-only: true
      - header: "RSS:Velocity filtered"
        semantic: "RSS:Velocity filtered"
        units: "m/s"
        description: "Surface flow velocity after the internal filtering of the sensor; smoother and less noisy than the raw velocity."
        read-only: true
      - header: "RSS:Signal"
        description: "Strength of the radar return. Low values mean the velocity reading is unreliable."
        read-only: true
      - header: "RSS:Q1"
        description: "Radar signal quality indicator reported by the sensor."
        read-only: true
      - header: "RSS:Q2"
        description: "Second radar signal quality indicator reported by the sensor."
        read-only: true
      - header: "RSS:Tilt"
        description: "Tilt angle of the radar sensor, used to project the measured velocity onto the surface."
        read-only: true
      - header: "RSS:Trace"
        description: "Raw radar spectrum recorded together with the measurement."
        read-only: true
