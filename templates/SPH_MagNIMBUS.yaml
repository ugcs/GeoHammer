  # Template display name
  name: "MagNIMBUS"
  # Type of template for parsing data. Options are CSV and ColumnsFixedWidth
  file-type: CSV
  # Applies to the first 10 non-empty lines of the file to detect template
  match-regex: >-
    ^.*Date,Time,.*Latitude,Longitude,Heading,.*Altitude,Altitude AGL,.*alid,TMI.*
  file-format:
  # Applies to CSV type. 'true' if file has headers, otherwise false
    has-header: true
    # The symbol which uses to make a comment
    comment-prefix: '#'
    # The symbol used to separate the integer part from the fractional part of a number written in decimal form. Options are ',' and '.'
    decimal-separator: '.'
    # Applies to CSV type. The symbol to separate values from line in CSV file;
    separator: ','
  # Applied on a quality check to all data values
  data-validation: '{Valid} == 1'
  # Mapping data from source file to data. Required fields are latitude, longitude, time or timestamp, date or date-time
  data-mapping:
    latitude:
      header: Latitude
    longitude:
      header: Longitude
    time:
      header: Time
      format: 'H:mm:ss.fff'
    date:
      header: Date
      format: 'yyyy/MM/dd'
    data-values:
      - header: "TMI"
        semantic: "TMI"
        units: "nT"
        description: "Total magnetic field intensity: the scalar magnitude of the magnetic field at the sensor."
        read-only: true
      - header: "Heading"
        description: "Heading of the carrier in degrees clockwise from north."
        read-only: true
      - header: "Altitude"
        semantic: "Altitude"
        units: "m"
        description: "Altitude above sea level, from the GNSS receiver."
        read-only: true
      - header: "Altitude AGL"
        semantic: "Altitude AGL"
        units: "m"
        description: "Height above ground level, measured by the onboard altimeter."
        read-only: true
      - header: "Valid"
        description: "Validity flag of the reading: 1 means the sample passed the sensor self-check, any other value means it must be discarded."
        read-only: true
      - header: "Next WP"
        semantic: "Line"
        description: "Survey line the point belongs to; points sharing a value form one line. This file uses the index of the next waypoint of the planned route, which increments at every turn."
        read-only: true
      - header: "Bx"
        semantic: "Bx"
        units: "nT"
        description: "X component of the magnetic field vector in the sensor frame."
      - header: "By"
        semantic: "By"
        units: "nT"
        description: "Y component of the magnetic field vector in the sensor frame."
      - header: "Bz"
        semantic: "Bz"
        units: "nT"
        description: "Z component of the magnetic field vector in the sensor frame."
      - header: "TMI_S"
        semantic: "TMI_S"
        units: "nT"
        description: "Secondary total magnetic field intensity channel reported by the sensor."
      - header: "TMI_Fixed"
        semantic: "TMI_Fixed"
        units: "nT"
        description: "Total magnetic field intensity after compensation for the magnetic interference of the carrier."
      - header: "TMI_Fixed_Filtered"
        semantic: "TMI_Fixed_Filtered"
        units: "nT"
        description: "Compensated total magnetic field intensity after noise filtering; the channel normally used for interpretation."
