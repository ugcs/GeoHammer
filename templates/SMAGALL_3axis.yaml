  # Template display name
  name: "SMAGALL 3-axis"
  # Type of template for parsing data. Options are CSV and ColumnsFixedWidth
  file-type: CSV
  # Applies to the first 10 non-empty lines of the file to detect template
  match-regex: >-
    ^.*Time,magneticX,magneticY,magneticZ,magneticTotal,longitude,latitude,altitude.*
  file-format:
  # Applies to CSV type. 'true' if the file has headers, otherwise false
    has-header: true
    # The symbol which uses to make a comment
    comment-prefix: '%'
    # The symbol used to separate the integer part from the fractional part of a number written in decimal form. Options are ',' and '.'
    decimal-separator: '.'
    # Applies to CSV type. The symbol to separate values from line in CSV file;
    separator: ','
  # Mapping data from source file to data. Required fields are latitude, longitude, time or timestamp, date or date-time
  data-mapping:
    latitude:
      header: 'latitude'
    longitude:
      header: 'longitude'
    date-time:
      header: 'Time'
      format: 'yyyy-MM-dd [ ]HH:mm:ss[.fff]'
    data-values:
      - header: "magneticTotal"
        semantic: "TMI"
        units: "nT"
        description: "Total magnetic field intensity: the scalar magnitude of the magnetic field at the sensor."
        read-only: true
      - header: "altitude"
        semantic: "Altitude"
        units: "m"
        description: "Altitude above sea level, from the GNSS receiver."
        read-only: true
      - header: "magneticX"
        semantic: "Bx"
        units: "nT"
        description: "X component of the magnetic field vector in the sensor frame."
        read-only: true
      - header: "magneticY"
        semantic: "By"
        units: "nT"
        description: "Y component of the magnetic field vector in the sensor frame."
        read-only: true
      - header: "magneticZ"
        semantic: "Bz"
        units: "nT"
        description: "Z component of the magnetic field vector in the sensor frame."
        read-only: true
      - header: "Line"
        semantic: "Line"
        description: "Survey line the point belongs to; points sharing a value form one line."
        read-only: true
