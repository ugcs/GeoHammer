  # Template display name
  name: "SkyHub"
  # Type of template for parsing data. Options are CSV and ColumnsFixedWidth
  file-type: CSV
  # Applies to the first 10 non-empty lines of the file to detect template
  match-regex: >-
    ^.*Elapsed,Date,Time,Pitch,Roll,.*Latitude,Longitude,Altitude,.*Velocity.*RTK.*
  # Indicates that position data can come from a source
  positional: true
  file-format:
  # Applies to CSV type. 'true' if file has headers, otherwise false
    has-header: true
    # The symbol which uses to make a comment
    comment-prefix: '#'
    # The symbol used to separate the integer part from the fractional part of a number written in decimal form. Options are ',' and '.'
    decimal-separator: '.'
    # Applies to CSV type. The symbol to separate values from line in CSV file;
    separator: ','
  # Mapping data from source file to data. Required fields are latitude, longitude, time or timestamp, date or date-time
  data-mapping:
    latitude:
      header: Latitude
    longitude:
      header: Longitude
    time:
      header: Time
      format: 'H:mm:ss.fff'
    date:
      header: Date
      format: 'yyyy/MM/dd'
    sgy-traces:
      - header: "ECHO:Trace Hi"
      - header: "ECHO:Trace Lo"
      - header: "GPR:Trace"
      - header: "zGPR:Trace"
    data-values:
      - header: "Altitude"
        semantic: "Altitude"
        units: "m"
        description: "Altitude above sea level, from the GNSS receiver."
        read-only: true
      - header: "Altitude RTK"
        semantic: "Altitude RTK"
        units: "m"
        description: "Altitude above sea level from the RTK GNSS receiver, more accurate than the standard GNSS altitude."
        read-only: true
      - header: "ALT:Altitude"
        semantic: "Altitude AGL"
        units: "m"
        description: "Height above ground level, measured by the onboard altimeter."
      - header: "Ellipsoidal Height"
        semantic: "Ellipsoidal Height"
        units: "m"
        description: "Height above the WGS-84 ellipsoid, before the geoid correction that gives altitude above sea level."
      - header: "Elapsed"
        description: "Time elapsed since the start of the log."
        read-only: true
      - header: "Next WP"
        semantic: "Line"
        description: "Survey line the point belongs to; points sharing a value form one line. This file uses the index of the next waypoint of the planned route, which increments at every turn."
        read-only: true
      - header: "Velocity"
        semantic: "Velocity"
        units: "m/s"
        description: "Ground speed of the carrier."
        read-only: true
      - header: "Pitch"
        semantic: "Pitch"
        units: "°"
        description: "Pitch angle of the carrier, positive when the front is up."
        read-only: true
      - header: "Roll"
        semantic: "Roll"
        units: "°"
        description: "Roll angle of the carrier, positive when the right side is down."
        read-only: true
      - header: "Heading"
        semantic: "Heading"
        units: "°"
        description: "Heading of the carrier in degrees clockwise from north."
      - header: "ECHO:Depth"
        semantic: "ECHO:Depth"
        units: "m"
        description: "Water depth below the transducer of the single-beam echo sounder."
      - header: "ECHO:True Depth"
        semantic: "ECHO:True Depth"
        units: "m"
        description: "Water depth of the echo sounder corrected for the speed of sound in water; the channel to use for bathymetry."
      - header: "ECHO:Depth Hi"
        semantic: "ECHO:Depth Hi"
        units: "m"
        description: "Water depth from the high-frequency channel of the dual-frequency echo sounder, which reflects from the top of the sediment."
      - header: "ECHO:True Depth Hi"
        semantic: "ECHO:True Depth Hi"
        units: "m"
        description: "High-frequency echo sounder depth corrected for the speed of sound in water."
      - header: "ECHO:Depth Lo"
        semantic: "ECHO:Depth Lo"
        units: "m"
        description: "Water depth from the low-frequency channel of the dual-frequency echo sounder, which penetrates soft sediment and reflects from the harder layer below it."
      - header: "ECHO:True Depth Lo"
        semantic: "ECHO:True Depth Lo"
        units: "m"
        description: "Low-frequency echo sounder depth corrected for the speed of sound in water."
      - header: "ECHO:Pitch"
        semantic: "ECHO:Pitch"
        units: "°"
        description: "Pitch angle of the echo sounder."
      - header: "ECHO:Roll"
        semantic: "ECHO:Roll"
        units: "°"
        description: "Roll angle of the echo sounder."
      - header: "GAS:Methane"
        semantic: "GAS:Methane"
        units: "ppm-m"
        description: "Methane concentration integrated over the path of the laser beam to the reflecting surface, measured by the laser methane detector."
      - header: "AIR:Speed"
        semantic: "AIR:Speed"
        units: "m/s"
        description: "Wind speed measured by the onboard anemometer."
      - header: "AIR:Direction"
        semantic: "AIR:Direction"
        units: "°"
        description: "Wind direction measured by the onboard anemometer, in degrees clockwise from north."
      - header: "MBES:Depth"
        semantic: "MBES:Depth"
        units: "m"
        description: "Water depth below the multibeam echo sounder."
      - header: "MBES:True depth"
        semantic: "MBES:True depth"
        units: "m"
        description: "Water depth of the multibeam echo sounder corrected for the speed of sound in water."
      - header: "MBES:Temperature"
        semantic: "MBES:Temperature"
        units: "C"
        description: "Water temperature measured by the multibeam echo sounder."
      - header: "MBES:Pressure"
        semantic: "MBES:Pressure"
        units: "Bar"
        description: "Water pressure measured by the multibeam echo sounder."
      - header: "MBES:Pitch"
        semantic: "MBES:Pitch"
        units: "°"
        description: "Pitch angle of the multibeam echo sounder."
      - header: "MBES:Roll"
        semantic: "MBES:Roll"
        units: "°"
        description: "Roll angle of the multibeam echo sounder."
      - header: "Latitude RTK"
        description: "Latitude from the RTK GNSS receiver, more accurate than the onboard GNSS position."
        read-only: true
      - header: "Longitude RTK"
        description: "Longitude from the RTK GNSS receiver, more accurate than the onboard GNSS position."
        read-only: true

