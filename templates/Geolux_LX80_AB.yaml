  # Template display name
  name: "Geolux LX-80-AB"
  # Code of template
  code: "Geolux-LX-80-AB"
  # Type of template for parsing data. Options are CSV and ColumnsFixedWidth
  file-type: CSV
  # Applies to the first 10 non-empty lines of the file to detect template
  match-regex: >-
    ^.*Date,Time,.*Latitude,Longitude,Heading,.*Altitude.*LX:Distance.*
  file-format:
  # Applies to CSV type. 'true' if file has headers, otherwise false
    has-header: true
    # The symbol which used to make a comment
    comment-prefix: '#'
    # The symbol used to separate the integer part from the fractional part of a number written in decimal form. Options are ',' and '.'
    decimal-separator: '.'
    # Applies to CSV type. The symbol to separate values from line in CSV file;
    separator: ','
  # Applied on a quality check to all data values
  data-validation: '{LX:SNR} > 30 && {LX:SD} < 100'
  # Mapping data from source file to data. Required fields are latitude, longitude, time or timestamp, date or date-time
  data-mapping:
    latitude:
      header: Latitude
    longitude:
      header: Longitude
    time:
      header: Time
      format: 'H:mm:ss.fff'
    date:
      header: Date
      format: 'yyyy/MM/dd'
    data-values:
      - header: "Heading"
        semantic: "Heading"
        units: "deg"
        description: "Heading of the carrier in degrees clockwise from north."
        read-only: true
      - header: "Altitude RTK"
        semantic: "Altitude RTK"
        units: "m"
        description: "Altitude above sea level from the RTK GNSS receiver, more accurate than the standard GNSS altitude."
        read-only: true
      - header: "Ellipsoidal Height"
        semantic: "Ellipsoidal Height"
        units: "m"
        description: "Height above the WGS-84 ellipsoid, before the geoid correction that gives altitude above sea level."
        read-only: true
      - header: "Altitude AGL"
        semantic: "Altitude AGL"
        units: "m"
        description: "Height above ground level, measured by the onboard altimeter."
      - header: "LX:Distance"
        semantic: "LX:Distance"
        units: "m"
        description: "Distance from the LX-80 laser sensor to the surface below it. Subtract it from the carrier altitude to get the elevation of the surface."
        read-only: true
      - header: "LX:Temperature"
        semantic: "LX:Temperature"
        units: "C"
        description: "Internal temperature of the LX-80 sensor."
      - header: "Line"
        semantic: "Line"
        description: "Survey line the point belongs to; points sharing a value form one line."
        read-only: true
