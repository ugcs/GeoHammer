name: MacOS Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      timestamp:
        required: true
        type: string
    secrets:
      SIGNING_CERTIFICATE_P12:
        required: true
      P12_PASSWORD:
        required: true
      CERT_NAME:
        required: true
      NOTARIZATION_KEY:
        required: true
      NOTARIZATION_KEY_ID:
        required: true
      NOTARIZATION_ISSUER_ID:
        required: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: 'jdk+fx'

      - name: Cache local maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set maven project version
        run: mvn versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Resolve artifact name
        id: name
        run: |
          app=$(echo '${{ inputs.version }}' | sed -E 's/-.*$//')
          echo "base=GeoHammer-$app.${{ inputs.timestamp }}-macos-aarch64" >> "$GITHUB_OUTPUT"

      - name: Build
        run: mvn --batch-mode install -P macos-build -Dbuild.timestamp=${{ inputs.timestamp }} -Dassembly.timestamp=${{ inputs.timestamp }}

      - name: Import developer id certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          echo "$CERT_P12" | base64 --decode > signing_cert.p12
          security import signing_cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Create entitlements.plist
        run: |
          cat << EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
              "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.cs.allow-dyld-environment-variables</key>
              <true/>
            </dict>
          </plist>
          EOF

      - name: Sign native libraries
        env:
          APP_PATH: target/installer/GeoHammer.app
          CERT_NAME: ${{ secrets.CERT_NAME }}
        run: |
          unzip -q "$APP_PATH/Contents/app/geohammer-jar-with-dependencies.jar" 'natives/macosx-universal/*.jnilib' -d tmp_natives
          find tmp_natives/natives/macosx-universal -type f \( -name "*.jnilib" -o -name "*.dylib" \) -exec codesign --verbose --sign "$CERT_NAME" --timestamp "{}" \;
          (cd tmp_natives && zip -q -ur "../$APP_PATH/Contents/app/geohammer-jar-with-dependencies.jar" natives/macosx-universal/*.jnilib natives/macosx-universal/*.dylib)
          find $APP_PATH/Contents/runtime/Contents/Home -type f \( -name "*.jnilib" -o -name "*.dylib" \) -exec codesign --remove-signature "{}" \;
          find $APP_PATH/Contents/runtime/Contents/Home -type f \( -name "*.jnilib" -o -name "*.dylib" \) -exec codesign --verbose --sign "$CERT_NAME" --timestamp "{}" \;

          # Every file in the runtime bin/ is a Mach-O launcher (java, keytool, jwebserver, ...)
          find $APP_PATH/Contents/runtime/Contents/Home/bin -type f -exec codesign --remove-signature "{}" \;
          find $APP_PATH/Contents/runtime/Contents/Home/bin -type f -exec codesign --verbose --sign "$CERT_NAME" --options runtime --entitlements entitlements.plist --timestamp "{}" \;
          find $APP_PATH/Contents/runtime -type f -name "jspawnhelper" -exec codesign --remove-signature "{}" \;
          find $APP_PATH/Contents/runtime -type f -name "jspawnhelper" -exec codesign --verbose --sign "$CERT_NAME" --options runtime --entitlements entitlements.plist --timestamp "{}" \;
          rm -rf tmp_natives

          codesign --verbose --remove-signature "$APP_PATH/Contents/runtime/Contents/MacOS/libjli.dylib"
          codesign --verbose --sign "$CERT_NAME" --timestamp "$APP_PATH/Contents/runtime/Contents/MacOS/libjli.dylib"

          codesign -dv --verbose=4 "$APP_PATH/Contents/runtime/Contents/MacOS/libjli.dylib"
          codesign -dv --verbose=4 "$APP_PATH/Contents/runtime/Contents/Home/bin/java"

      - name: Sign .app
        env:
          APP_PATH: target/installer/GeoHammer.app
          CERT_NAME: ${{ secrets.CERT_NAME }}
        run: |
          codesign --remove-signature "$APP_PATH"
          codesign --verbose --timestamp --options runtime --entitlements entitlements.plist --sign "$CERT_NAME" "$APP_PATH"
          codesign -vv --verify "$APP_PATH"

      - name: Write notarytool api key
        env:
          NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}
        run: |
          echo "$NOTARIZATION_KEY" > AuthKey_${{ secrets.NOTARIZATION_KEY_ID }}.p8

      - name: Notarize app
        env:
          APP_PATH: target/installer/GeoHammer.app
          APP_ZIP: target/installer/GeoHammer.zip
        run: |
          # Create ZIP for notarization
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$APP_ZIP"
          # Submit to Apple Notary Service
          submission=$(xcrun notarytool submit "$APP_ZIP" \
            --key AuthKey_${{ secrets.NOTARIZATION_KEY_ID }}.p8 \
            --key-id ${{ secrets.NOTARIZATION_KEY_ID }} \
            --issuer ${{ secrets.NOTARIZATION_ISSUER_ID }} \
            --wait --output-format json)
          echo "$submission"
          id=$(echo "$submission" | jq -r '.id')
          status=$(echo "$submission" | jq -r '.status')
          # Rejection reasons appear only in the notary log, so always fetch it
          xcrun notarytool log "$id" \
            --key AuthKey_${{ secrets.NOTARIZATION_KEY_ID }}.p8 \
            --key-id ${{ secrets.NOTARIZATION_KEY_ID }} \
            --issuer ${{ secrets.NOTARIZATION_ISSUER_ID }} || echo "Could not fetch notary log"
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarization failed with status $status"
            exit 1
          fi

      - name: Staple notarization ticket
        env:
          APP_PATH: target/installer/GeoHammer.app
        run: |
          xcrun stapler staple "$APP_PATH"
          ./$APP_PATH/Contents/runtime/Contents/Home/bin/java -version
          cd target/installer
          hdiutil create -fs HFS+ -srcfolder GeoHammer.app "${{ steps.name.outputs.base }}.dmg"

      - name: Stage artifacts
        run: mkdir staging && cp "target/installer/${{ steps.name.outputs.base }}.dmg" staging

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: staging/
          retention-days: 5
